<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Meine Tesla-Bestellung</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
  <header>
    <h1>Meine Tesla-Bestellung</h1>
    <div class="actions">
      <button id="refresh">Aktualisieren</button>
      <button id="tesla-logout" title="Tesla-Token aus diesem Browser löschen">Tesla trennen</button>
      <button id="diag" title="Feldliste ohne persönliche Daten zum Weitergeben">Diagnose kopieren</button>
      <button id="logout" title="Von dieser Seite abmelden">Abmelden</button>
    </div>
  </header>
  <div id="diagbox" class="card" hidden>
    <h2>Diagnose <span class="muted">(Feldnamen, Datumsangaben und Status, keine persönlichen Daten)</span></h2>
    <p id="diagmsg" class="muted"></p>
    <textarea id="diagtext" readonly style="min-height:220px"></textarea>
    <p><button id="diagclose">Schließen</button></p>
  </div>
  <div id="out"><p class="empty">Lade …</p></div>
  <footer id="meta"></footer>
</main>

<script>
const out = document.getElementById('out');
const metaEl = document.getElementById('meta');
const btn = document.getElementById('refresh');
const LOCALE = 'de-DE';
const CACHE_KEY = 'tos.lastData';
const HISTORY_KEY = 'tos.history2';
const CACHE_MS = 5 * 60 * 1000;

const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pick = (obj, ...paths) => {
  for (const p of paths) {
    const v = p.split('.').reduce((o, k) => (o == null ? o : o[k]), obj);
    if (v !== undefined && v !== null && v !== '') return v;
  }
  return null;
};
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

// ---------- Kataloge (Optionscodes nach TOST, Tesla-Standorte) ----------
let OPTION_CODES = null;
let LOCATIONS = null;
async function loadOptionCodes() {
  if (OPTION_CODES) return;
  try { OPTION_CODES = (await (await fetch('/option_codes.json')).json()).codes || {}; } catch { OPTION_CODES = {}; }
}
async function loadLocations() {
  if (LOCATIONS) return;
  try { LOCATIONS = await (await fetch('/tesla_locations.json')).json(); } catch { LOCATIONS = {}; }
}
const CATEGORY_NAMES = {
  models: 'Modell', paints: 'Lackierung', interiors: 'Innenraum', seating: 'Sitze', wheels: 'Felgen', tires: 'Reifen',
  autopilot: 'Autopilot', battery: 'Batterie', connectivity: 'Konnektivität', supercharging: 'Supercharging', misc: 'Sonstiges',
};
const CATEGORY_ORDER = ['models', 'paints', 'interiors', 'seating', 'wheels', 'tires', 'battery', 'autopilot', 'connectivity', 'supercharging', 'misc', null];

function decodeOptions(mkt) {
  if (!mkt) return [];
  return String(mkt).split(',').map((s) => s.trim().replace(/^\$/, '')).filter(Boolean).map((code) => {
    const e = OPTION_CODES?.[code];
    return { code, label: e?.l || null, short: e?.s || null, cat: e?.c || null };
  });
}

// Modell / Lack / Innenraum wie in der TOST-Kurzansicht
function summarizeConfig(options) {
  let model = null, paint = null, interior = null;
  for (const o of options) {
    const label = (o.short || o.label || '').trim();
    if (!label) continue;
    if (o.cat === 'paints' || (!o.cat && /^(PP|PN|PS|PA)/.test(o.code))) paint ??= label.replace('Metallic', '').replace('Multi-Coat', '').trim();
    else if (o.cat === 'interiors' || o.cat === 'seating' && /^(IP|IN|IW|IX|IY)/.test(o.code) || (!o.cat && /^(IP|IN|IW|IX|IY)/.test(o.code))) interior ??= label;
    if (o.cat === 'models' || (/Model/.test(label) && label.length > 10)) {
      const m = label.match(/(Model [YSX3])(?:.*?((?:AWD|RWD) (?:LR|SR|P)))?/);
      model ??= o.short ? label : (m ? (m[2] ? `${m[1]} – ${m[2]}` : label) : label);
    }
  }
  return { model, paint, interior };
}

// ---------- Formatierung ----------
function parseIso(v) {
  if (typeof v !== 'string' || !v.trim()) return null;
  let s = v.trim().replace(' ', 'T');
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) s += 'T00:00:00';
  const d = new Date(s);
  if (isNaN(d)) return null;
  return { d, hasTime: /T\d{2}:\d{2}/.test(s) && !/T00:00(:00)?/.test(s) };
}
function fmtDate(v) {
  const p = parseIso(v);
  if (!p) return typeof v === 'string' ? v.trim() : (v == null ? null : String(v));
  return p.hasTime
    ? p.d.toLocaleString(LOCALE, { dateStyle: 'medium', timeStyle: 'short' })
    : p.d.toLocaleDateString(LOCALE, { dateStyle: 'medium' });
}
function money(amount, code) {
  if (amount == null || amount === '') return null;
  const n = Number(amount);
  if (isNaN(n)) return String(amount);
  try { return new Intl.NumberFormat(LOCALE, { style: 'currency', currency: code || 'EUR', maximumFractionDigits: 2 }).format(n); }
  catch { return `${n} ${code || ''}`.trim(); }
}
function row(label, value, cls = '', html = false) {
  if (value === null || value === undefined || value === '') return '';
  return `<dt>${esc(label)}</dt><dd class="${cls}">${html ? value : esc(value)}</dd>`;
}
const mask = (s) => s.slice(0, 3) + '*'.repeat(Math.max(s.length - 3, 0));
function secret(value) {
  const v = String(value);
  return `<span class="secret mono" data-v="${esc(v).replace(/"/g, '&quot;')}" title="Klicken zum Anzeigen">${esc(mask(v))}</span>`;
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('.secret');
  if (!el) return;
  const shown = el.dataset.shown === '1';
  el.textContent = shown ? mask(el.dataset.v) : el.dataset.v;
  el.dataset.shown = shown ? '0' : '1';
});
const yesNo = (v) => v === true ? 'ja' : v === false ? 'nein' : null;

// Auslieferungstermin wie TOST: deliveryDetails.regData.deliveryAppointment, deliveryDetails.deliveryAppointment,
// finalPayment.data.deliveryAppointment, dann scheduling.deliveryAppointmentDate / apptDateTimeAddressStr
function appointmentOf(t) {
  const sources = [pick(t, 'deliveryDetails.regData.deliveryAppointment'), pick(t, 'deliveryDetails.deliveryAppointment'), pick(t, 'finalPayment.data.deliveryAppointment')];
  for (const s of sources) {
    if (!s || typeof s !== 'object') continue;
    for (const k of ['appointmentDate', 'appointmentDateUtc']) if (parseIso(s[k])) return s[k];
  }
  const raw = pick(t, 'scheduling.deliveryAppointmentDate');
  if (typeof raw === 'string' && raw.trim()) return raw.trim();
  const txt = pick(t, 'scheduling.apptDateTimeAddressStr');
  if (typeof txt === 'string') { const first = txt.split('\n')[0].trim(); if (parseIso(first)) return first; }
  return null;
}

// ---------- Historie: kompletter Vergleich der Tesla-Antwort wie TOST ----------
const IGNORE_PATHS = ['.card.', '.strings.', 'details.state', 'isMatched', 'vehicleModelYear', 'isDeliveryEstimatesEnabled',
  'isAvailableForMatch', 'deliveryReadiness', 'agreementDetails', 'finalPayment.data.vehicleId', 'deliveryAcceptance.gates',
  'reggieRegistrationStatus', 'finalPayment.complete', 'finalPaymentStatus', 'apptDateTimeAddressStr', 'isInventoryOrMatched',
  'hasFinalInvoice', 'hasActiveInvoice', 'selfSchedulingDetails.deliveryLocationId', 'registration.orderDetails.vin',
  'registration.regData.orderDetails.vin', 'finalPayment.data.vin', 'deliveryDetails.regData.orderDetails.vin', 'order.vehicleMapId',
  'details.tasks.scheduling.deliveryWindowDisplayStr'];
const PATH_LABELS = {
  'order.vin': 'FIN', 'order.orderStatus': 'Bestellstatus', 'details.orderStatus': 'Bestellstatus', 'order.modelCode': 'Modell',
  'order.mktOptions': 'Konfiguration', 'meta.vinShows': 'FIN in der Tesla-App sichtbar', 'meta.motorNumber': 'Motornummer',
  'details.tasks.scheduling.deliveryWindowDisplay': 'Lieferzeitraum',
  'details.tasks.scheduling.deliveryAppointmentDate': 'Auslieferungstermin',
  'details.tasks.scheduling.deliveryAddressTitle': 'Auslieferungszentrum',
  'details.tasks.scheduling.deliveryType': 'Lieferart',
  'details.tasks.finalPayment.data.etaToDeliveryCenter': 'Voraussichtliche Ankunft im Lieferzentrum',
  'details.tasks.registration.orderDetails.vehicleRoutingLocation': 'Abholort',
  'details.tasks.registration.expectedRegDate': 'Voraussichtliches Zulassungsdatum',
  'details.tasks.registration.orderDetails.reservationDate': 'Reservierungsdatum',
  'details.tasks.registration.orderDetails.orderBookedDate': 'Bestelldatum',
  'details.tasks.registration.orderDetails.vehicleOdometer': 'Kilometerstand',
  'details.tasks.registration.orderDetails.registrationStatus': 'Zulassungsstatus',
  'details.tasks.finalPayment.data.paymentDetails': 'Zahlungsdetails',
  'details.tasks.finalPayment.data.accountBalance': 'Kontostand',
  'details.tasks.finalPayment.data.amountDue': 'Offener Betrag',
  'details.tasks.finalPayment.amountDue': 'Offener Betrag',
  'details.tasks.finalPayment.data.amountDueAfterRefund': 'Nach Rückerstattung fälliger Betrag',
  'details.tasks.finalPayment.data.amountDueFinancier': 'Finanzierter Betrag',
  'details.tasks.finalPayment.data.financingDetails.financialProductType': 'Finanzierungsprodukt',
  'details.tasks.finalPayment.data.financingDetails.teslaFinanceDetails.financePartnerName': 'Finanzierungspartner',
  'details.tasks.finalPayment.data.financingDetails.teslaFinanceDetails.monthlyPayment': 'Monatliche Rate',
  'details.tasks.finalPayment.data.financingDetails.teslaFinanceDetails.termsInMonths': 'Vertragslaufzeit (Monate)',
  'details.tasks.finalPayment.data.financingDetails.teslaFinanceDetails.interestRate': 'Zinssatz',
  'details.tasks.finalPayment.data.financingDetails.teslaFinanceDetails.mileage': 'Laufleistung pro Jahr',
  'details.tasks.finalPayment.data.financingDetails.teslaFinanceDetails.approvedLoanAmount': 'Genehmigter Betrag',
  'details.tasks.finalPayment.status': 'Zahlungsstatus',
  'details.tasks.finalPayment.data.vehicleregistration': 'Fahrzeugzulassung',
  'details.tasks.finalPayment.data.vehicleParts': 'Fahrzeugteile',
  'details.tasks.deliveryAcceptance.vehicleIsReady': 'Fahrzeug bereit',
};
function flatten(obj, prefix, outMap) {
  if (Array.isArray(obj)) outMap[prefix] = JSON.stringify(obj);
  else if (obj && typeof obj === 'object') for (const [k, v] of Object.entries(obj)) flatten(v, prefix ? `${prefix}.${k}` : k, outMap);
  else outMap[prefix] = obj ?? null;
  return outMap;
}
function diffDeep(a, b) {
  const fa = flatten(a, '', {}), fb = flatten(b, '', {});
  const changes = [];
  for (const k of new Set([...Object.keys(fa), ...Object.keys(fb)])) {
    if (IGNORE_PATHS.some((p) => k.includes(p))) continue;
    const va = fa[k] ?? null, vb = fb[k] ?? null;
    if (JSON.stringify(va) !== JSON.stringify(vb)) changes.push({ path: k, before: va, after: vb });
  }
  return changes;
}
function trackable(entry) { return { order: entry.account ?? {}, details: entry.details ?? {}, meta: entry.meta ?? {} }; }
function recordHistory(data) {
  const hist = store.get(HISTORY_KEY) || {};
  for (const entry of data.orders || []) {
    if (!entry.details) continue;
    const rn = entry.referenceNumber;
    const current = trackable(entry);
    const h = hist[rn] || { firstAt: data.fetchedAt, changes: [], last: null };
    if (h.last) {
      for (const c of diffDeep(h.last, current)) h.changes.push({ at: data.fetchedAt, ...c });
      if (h.changes.length > 500) h.changes = h.changes.slice(-500);
    }
    h.last = current;
    h.lastAt = data.fetchedAt;
    hist[rn] = h;
  }
  store.set(HISTORY_KEY, hist);
  return hist;
}
const pathLabel = (p) => PATH_LABELS[p] || p.replace(/^details\.tasks\./, '').replace(/^details\./, '').replace(/^order\./, 'Konto: ');
function fmtChangeValue(path, v) {
  if (v == null || v === '') return '(leer)';
  if (path === 'order.vin') return secret(v);
  if (/Date|eta|Eta/.test(path) && parseIso(v)) return esc(fmtDate(v));
  if (path === 'order.mktOptions') return esc(String(v).split(',').map((c) => c.trim().replace(/^\$/, '')).join(', '));
  if (typeof v === 'boolean') return v ? 'ja' : 'nein';
  const s = String(v);
  return esc(s.length > 160 ? s.slice(0, 160) + '…' : s);
}

// ---------- Bestellverlauf (Timeline) wie TOST ----------
function timelineOf(entry, hist) {
  const t = entry.details?.tasks ?? {};
  const reg = t.registration ?? {}, oi = reg.orderDetails ?? {}, fp = t.finalPayment?.data ?? {}, sch = t.scheduling ?? {};
  const items = [];
  const add = (ts, key, value = '') => { if (ts) items.push({ ts, key, value }); };
  add(oi.reservationDate, 'Reservierung');
  add(oi.orderBookedDate || oi.orderPlacedDate, 'Bestellung aufgegeben');
  const changes = hist?.changes || [];
  const changed = (p) => changes.filter((c) => c.path === p);
  const dw = changed('details.tasks.scheduling.deliveryWindowDisplay');
  if (sch.deliveryWindowDisplay && !dw.length) add(oi.orderBookedDate || oi.orderPlacedDate, 'Lieferzeitraum', sch.deliveryWindowDisplay);
  if (dw.length && dw[0].before) add(hist.firstAt, 'Lieferzeitraum', dw[0].before);
  for (const c of dw) add(c.at, 'Lieferzeitraum', c.after || 'entfernt');
  if (reg.expectedRegDate && !changed('details.tasks.registration.expectedRegDate').length) add(reg.expectedRegDate, 'Voraussichtliche Zulassung');
  for (const c of changed('details.tasks.registration.expectedRegDate')) add(c.after || c.at, 'Voraussichtliche Zulassung', c.after ? '' : 'entfernt');
  if (fp.etaToDeliveryCenter && !changed('details.tasks.finalPayment.data.etaToDeliveryCenter').length) add(fp.etaToDeliveryCenter, 'Ankunft im Lieferzentrum (ETA)');
  for (const c of changed('details.tasks.finalPayment.data.etaToDeliveryCenter')) add(c.after || c.at, 'Ankunft im Lieferzentrum (ETA)', c.after ? '' : 'entfernt');
  const appt = appointmentOf(t);
  if (appt) add(appt, 'Auslieferungstermin');
  for (const c of changed('order.vin')) if (c.after) add(c.at, 'FIN zugewiesen');
  for (const c of changed('order.orderStatus')) add(c.at, 'Bestellstatus', c.after);
  const odo = changed('details.tasks.registration.orderDetails.vehicleOdometer').find((c) => c.after != null && c.after !== '');
  if (odo) add(odo.at, 'Fahrzeug gebaut (Kilometerstand erschienen)');
  for (const c of changed('details.tasks.registration.orderDetails.vehicleRoutingLocation')) add(c.at, 'Abholort geändert', c.after);
  items.sort((a, b) => (parseIso(a.ts)?.d ?? 0) - (parseIso(b.ts)?.d ?? 0));
  const seen = new Set();
  return items.map((i) => { const again = seen.has(i.key); seen.add(i.key); return { ...i, again }; });
}

// ---------- Darstellung ----------
const DELIVERY_TYPE = { PICKUP_SERVICE_CENTER: 'Abholung im Service-Center', HOME_DELIVERY: 'Lieferung nach Hause', DIRECT: 'Direktlieferung' };
const STEP_NAMES = { registration: 'Registrierung', financing: 'Zahlungsart', scheduling: 'Liefertermin', insurance: 'Versicherung', finalPayment: 'Schlusszahlung', agreements: 'Verträge', deliveryAcceptance: 'Übergabe' };

function steps(tasks) {
  return Object.entries(tasks)
    .filter(([, t]) => t && t.required !== false && t.order != null)
    .sort((a, b) => a[1].order - b[1].order)
    .map(([key, t]) => {
      const done = t.complete === true;
      const now = !done && t.enabled === true;
      const cls = done ? 'done' : now ? 'now' : 'wait';
      const title = STEP_NAMES[key] ?? key;
      const cardTitle = pick(t, 'card.title');
      const body = pick(t, 'card.subtitle', 'card.messageBody');
      const detail = typeof body === 'number' ? money(body, pick(t, 'currencyFormat.currencyCode')) : body;
      const parts = [];
      if (cardTitle && cardTitle !== title) parts.push(cardTitle);
      if (detail && detail !== cardTitle) parts.push(detail);
      return `<div class="step ${cls}"><div class="dot">${done ? '✓' : ''}</div>
        <div><div class="step-title">${esc(title)}</div>${parts.length ? `<div class="step-sub">${esc(parts.join(' · '))}</div>` : ''}</div></div>`;
    }).join('');
}

function configSection(options) {
  if (!options.length) return '';
  const groups = new Map();
  for (const o of options) { const k = o.cat || null; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(o); }
  const order = [...CATEGORY_ORDER, ...[...groups.keys()].filter((k) => !CATEGORY_ORDER.includes(k))];
  const html = order.filter((k) => groups.has(k)).map((k) => `
    <div class="opt-cat">${esc(k ? (CATEGORY_NAMES[k] || k) : 'Nicht zugeordnet')}</div>
    ${groups.get(k).map((o) => `<div class="opt"><span class="mono code">${esc(o.code)}</span><span>${o.label ? esc(o.label) : '<span class="empty">unbekannter Code</span>'}</span></div>`).join('')}`).join('');
  return `<div class="card"><h2>Konfiguration</h2>${html}</div>`;
}

// ---------- Alle Felder (wie TOST --all): jede nicht-leere Angabe aus der Tesla-Antwort ----------
const GROUP_NAMES = { registration: 'Registrierung', financing: 'Zahlungsart', scheduling: 'Liefertermin', insurance: 'Versicherung',
  finalPayment: 'Schlusszahlung', agreements: 'Verträge', deliveryAcceptance: 'Übergabe', deliveryDetails: 'Lieferdetails', tradeIn: 'Inzahlungnahme',
  carbonCredit: 'Umweltbonus', chargingInstall: 'Ladeinstallation', orderDetails: 'Bestelldaten' };
const SKIP_IN_ALL = /(^|\.)(strings|translations)(\.|$)/;
function fmtAnyValue(path, v) {
  if (typeof v === 'boolean') return v ? 'ja' : 'nein';
  if (typeof v === 'number') return esc(String(v));
  const s = String(v);
  if (/vin$/i.test(path) && /^[A-HJ-NPR-Z0-9]{17}$/.test(s)) return secret(s);
  if (parseIso(s) && /\d{4}-\d{2}-\d{2}/.test(s)) return esc(fmtDate(s));
  return esc(s.length > 300 ? s.slice(0, 300) + '…' : s);
}
function allDataSection(entry) {
  const groups = [];
  const push = (name, obj, base) => {
    if (!obj || typeof obj !== 'object') return;
    const rows = Object.entries(flatten(obj, '', {}))
      .filter(([k, v]) => v !== null && v !== '' && v !== '[]' && v !== '{}' && !SKIP_IN_ALL.test(k))
      .map(([k, v]) => `<dt title="${esc(base + k)}">${esc(PATH_LABELS[base + k] || k)}</dt><dd>${fmtAnyValue(k, v)}</dd>`);
    if (rows.length) groups.push({ name, rows });
  };
  push('Konto-Übersicht (owner-api)', entry.account, 'order.');
  push('Bestellung (/order)', entry.meta, 'meta.');
  push('Reservierungsdetails (App-Endpunkt ownership/reservation-details)', entry.extra?.reservationDetails, 'reservation.');
  if (entry.extra?.reservationDetailsError) groups.push({ name: 'Reservierungsdetails (App-Endpunkt)', rows: [`<dt>Antwort</dt><dd class="empty">${esc(entry.extra.reservationDetailsError)}</dd>`] });
  const tasks = entry.details?.tasks ?? {};
  for (const [k, v] of Object.entries(tasks)) push(GROUP_NAMES[k] || k, v, `details.tasks.${k}.`);
  const rest = { ...(entry.details ?? {}) }; delete rest.tasks;
  push('Weitere Felder', rest, 'details.');
  const total = groups.reduce((n, g) => n + g.rows.length, 0);
  return `<div class="card"><h2>Alle Daten von Tesla <span class="muted">(${total} Felder)</span></h2>
    <p class="muted">Jede nicht-leere Angabe aus der Tesla-Antwort, wie TOST mit „--all“. Fahre mit der Maus über einen Namen, um den technischen Pfad zu sehen.</p>
    ${groups.map((g) => `<details open class="grp"><summary>${esc(g.name)} <span class="muted">(${g.rows.length})</span></summary><dl class="plain all">${g.rows.join('')}</dl></details>`).join('')}
  </div>`;
}

function render(entry, hist) {
  const { referenceNumber, details, meta, account, error } = entry;
  if (!details) return `<div class="card error"><strong>${secret(referenceNumber)}</strong><p>${esc(error || 'Keine Daten')}</p></div>`;
  const acc = account ?? {};
  const t = details.tasks ?? {};
  const reg = t.registration ?? {}, oi = reg.orderDetails ?? {}, fp = t.finalPayment?.data ?? {}, sch = t.scheduling ?? {};
  const cur = pick(t, 'finalPayment.currencyFormat.currencyCode') || pick(fp, 'currencyCode') || 'EUR';
  const options = decodeOptions(acc.mktOptions);
  const cfg = summarizeConfig(options);
  const vin = pick(acc, 'vin') ?? pick(meta ?? {}, 'vin', 'vehicleVin') ?? pick(t, 'deliveryDetails.regData.orderDetails.vin', 'registration.orderDetails.vin', 'finalPayment.data.vin', 'insurance.vin');
  const vinText = vin ? null : (meta?.vinShows === false ? 'noch nicht zugewiesen (Tesla zeigt sie noch nicht)' : 'noch nicht zugewiesen');
  const appt = appointmentOf(t);
  const dType = pick(t, 'scheduling.deliveryType', 'deliveryAcceptance.deliveryType');
  const odometer = oi.vehicleOdometer;
  const odoShown = odometer != null && odometer !== '' && Number(odometer) !== 30;
  const routingId = oi.vehicleRoutingLocation;
  const loc = routingId != null ? LOCATIONS?.[String(routingId)] : null;

  const headline = appt ? fmtDate(appt) : (sch.deliveryWindowDisplay || pick(t, 'scheduling.card.messageBody') || 'Noch kein Lieferzeitraum');
  const headlineLabel = appt ? 'Auslieferungstermin' : 'Voraussichtlicher Lieferzeitraum';
  const modelLine = [cfg.model, cfg.paint, cfg.interior].filter(Boolean).join(' / ') || pick(t, 'deliveryAcceptance.model') || acc.modelCode || 'Tesla';

  const orderRows = [
    row('Auftragsnummer', secret(referenceNumber), '', true),
    row('Bestellstatus', acc.orderStatus ?? details.orderStatus),
    vin ? row('FIN', secret(vin), '', true) : row('FIN', vinText, 'empty'),
    row('Modellcode', acc.modelCode, 'mono'),
    row('Reservierungsdatum', fmtDate(oi.reservationDate)),
    row('Bestelldatum', fmtDate(oi.orderBookedDate || oi.orderPlacedDate)),
    row('Motornummer', pick(meta ?? {}, 'motorNumber'), 'mono'),
    row('FIN in der Tesla-App sichtbar', yesNo(meta?.vinShows)),
    row('Land', pick(t, 'registration.country', 'agreements.countryCode') || acc.countryCode),
  ].join('');

  const vehicleRows = [
    odoShown ? row('Kilometerstand', `${odometer} ${oi.vehicleOdometerType || ''}`.trim()) : '',
    row('Fahrzeug bereit', yesNo(pick(t, 'deliveryAcceptance.vehicleIsReady'))),
    row('Zulassungsstatus', oi.registrationStatus),
    row('Voraussichtliches Zulassungsdatum', fmtDate(reg.expectedRegDate)),
  ].join('');

  const locHtml = loc ? `${esc(loc.n)} <span class="muted">(${esc(routingId)})</span><br><span class="muted">${esc([loc.a, [loc.z, loc.ci].filter(Boolean).join(' '), loc.co].filter(Boolean).join(', '))}${loc.p ? ' · ' + esc(loc.p) : ''}</span>` : null;
  const deliveryRows = [
    locHtml ? row('Abholort', locHtml, '', true) : (routingId != null ? row('Abholort (ID)', String(routingId)) : ''),
    row('Auslieferungszentrum', sch.deliveryAddressTitle),
    row('Ankunft im Lieferzentrum (ETA)', fmtDate(fp.etaToDeliveryCenter)),
    row('Auslieferungstermin', appt ? fmtDate(appt) : 'noch nicht vereinbart', appt ? '' : 'empty'),
    row('Lieferzeitraum', sch.deliveryWindowDisplay),
    row('Lieferart', DELIVERY_TYPE[dType] ?? dType),
  ].join('');

  const fin = fp.financingDetails ?? {};
  const tfd = fin.teslaFinanceDetails ?? {};
  const pay = Array.isArray(fp.paymentDetails) ? fp.paymentDetails : [];
  const isCash = fin.orderType === 'CASH' || !fp.financingIntent;
  const paymentRows = (isCash ? [
    row('Zahlungsart', fin.orderType ? (fin.orderType === 'CASH' ? 'Barkauf' : fin.orderType) : (fp.financingIntent ? null : 'Barkauf')),
    ...pay.map((p, i) => row(pay.length > 1 ? `Zahlung ${i + 1}` : 'Gezahlter Betrag', [money(p.amountPaid, cur), p.paymentType, fmtDate(p.paymentDate || p.date)].filter(Boolean).join(' · '))),
    row('Kontostand', money(fp.accountBalance, cur)),
    row('Offener Betrag', money(fp.amountDue ?? pick(t, 'finalPayment.amountDue'), cur)),
    row('Nach Rückerstattung fällig', money(fp.amountDueAfterRefund, cur)),
  ] : [
    row('Zahlungsart', 'Finanzierung'),
    row('Finanzierungsprodukt', fin.financialProductType),
    row('Finanzierungspartner', tfd.financePartnerName),
    row('Monatliche Rate', money(tfd.monthlyPayment, cur)),
    row('Vertragslaufzeit (Monate)', tfd.termsInMonths),
    row('Zinssatz', tfd.interestRate != null ? `${tfd.interestRate} %` : null),
    row('Laufleistung pro Jahr', tfd.mileage),
    row('Finanzierter Betrag', money(fp.amountDueFinancier, cur)),
    row('Genehmigter Betrag', money(tfd.approvedLoanAmount, cur)),
    row('Offener Betrag', money(fp.amountDue ?? pick(t, 'finalPayment.amountDue'), cur)),
  ]).join('');
  const paymentStatus = row('Zahlungsstatus', pick(t, 'finalPayment.status'));

  const ORDER_TYPES = { TESLA_LENDING: 'Finanzierung über Tesla', CASH: 'Barkauf', LEASE: 'Leasing', TESLA_LEASING: 'Leasing über Tesla', LOAN: 'Finanzierung', THIRD_PARTY: 'Fremdfinanzierung' };
  const CUSTOMER_TYPES = { PRIVATE: 'Privatkunde', BUSINESS: 'Geschäftskunde', COMPANY: 'Firma' };
  const REGISTRANT = { COMPANY: 'Firma', PRIVATE: 'Privatperson', INDIVIDUAL: 'Privatperson' };
  const TITLE_STATUS = { NEW: 'Neufahrzeug', USED: 'Gebrauchtfahrzeug' };
  const REG_STEPS = { REG_TYPE: 'Zulassungsart', REG_DETAILS: 'Zulassungsdaten', REG_DOCUMENTS: 'Dokumente', REG_COMPLETE: 'abgeschlossen' };
  const regData = reg.regData ?? {};
  const carousel = Array.isArray(meta?.carouselMessages) ? meta.carouselMessages : [];
  const statusRows = [
    row('Bestellstatus', acc.orderStatus ? `${acc.orderStatus}${acc.orderSubstatus ? ' (' + acc.orderSubstatus + ')' : ''}` : null),
    row('Fahrzeug-Map-ID', acc.vehicleMapId, 'mono'),
    row('Bestellart', ORDER_TYPES[reg.orderType] ?? reg.orderType),
    row('Kundentyp', CUSTOMER_TYPES[reg.customerType ?? meta?.customerType] ?? (reg.customerType ?? meta?.customerType)),
    row('Fahrzeugstatus', TITLE_STATUS[sch.vehicleTitleStatus] ?? sch.vehicleTitleStatus),
    row('Fahrzeug zugeordnet (Lagerfahrzeug/Match)', yesNo(sch.isInventoryOrMatched)),
    row('FIN in der Tesla-App sichtbar', yesNo(meta?.vinShows)),
    row('Zulassung: aktueller Schritt', REG_STEPS[reg.currentStep] ?? reg.currentStep),
    row('Zulassung auf', REGISTRANT[regData.registrantType] ?? regData.registrantType),
    row('Zulassung begonnen am', fmtDate(regData.startedOn)),
    row('Zulassung durch Tesla', yesNo(regData.isTeslaRegister ?? pick(regData, 'regDetails.isTeslaRegister'))),
    row('Zulassung abgeschlossen', yesNo(sch.isRegComplete)),
    row('Lieferschätzung aktiv', yesNo(sch.isDeliveryEstimatesEnabled)),
    row('Auslieferung mehr als 2 Wochen entfernt', yesNo(sch.isMoreThanTwoWeeks)),
    row('Termin selbst buchbar', yesNo(sch.isSelfSchedulingAvailable)),
    row('Umbuchung möglich', yesNo(sch.isEligibleForReschedule)),
    row('Gültiger Termin vorhanden', yesNo(sch.isValidAppointment)),
    row('Inzahlungnahme', pick(t, 'tradeIn.tradeInIntent') === 'No' ? 'keine' : (pick(t, 'tradeIn.status') ?? pick(t, 'tradeIn.card.subtitle'))),
    row('Zahlung bestätigt', yesNo(meta?.hasConfirmedOrderPrice)),
    sch.selfSchedulingUrl ? row('Terminbuchung', `<a href="${esc(sch.selfSchedulingUrl)}" target="_blank" rel="noopener">Bei Tesla öffnen</a>`, '', true) : '',
    meta?.accountUrl ? row('Tesla-Bestellseite', `<a href="${esc(meta.accountUrl)}" target="_blank" rel="noopener">tesla.com öffnen</a>`, '', true) : '',
  ].join('');
  const tipsHtml = carousel.length ? `<h2 class="sub">Hinweise von Tesla</h2>${carousel.map((c) => `<div class="tip"><b>${esc(c.header ?? c.title ?? '')}</b>${c.description ? `<div class="muted">${esc(c.description)}</div>` : ''}</div>`).join('')}` : '';

  const tl = timelineOf(entry, hist);
  const tlHtml = tl.length ? tl.map((i) => `<div class="tl"><span class="tl-date">${esc(fmtDate(i.ts) ?? '?')}</span><span>${i.again ? '<span class="muted">neu: </span>' : ''}${esc(i.key)}${i.value ? `: <b>${esc(i.value)}</b>` : ''}</span></div>`).join('') : '<p class="empty">Noch keine Verlaufsdaten.</p>';

  return `
    <div class="card">
      <div class="model">${esc(modelLine)}</div>
      <div class="window">${esc(headline)}</div>
      <div class="window-label">${esc(headlineLabel)}${acc.orderStatus ? ` · <span class="badge">${esc(acc.orderStatus)}</span>` : ''}</div>
      <h2 class="sub">Bestelldetails</h2><dl>${orderRows}</dl>
    </div>
    ${configSection(options)}
    ${vehicleRows ? `<div class="card"><h2>Fahrzeugstatus</h2><dl class="plain">${vehicleRows}</dl></div>` : ''}
    <div class="card"><h2>Auslieferung</h2><dl class="plain">${deliveryRows}</dl></div>
    <div class="card"><h2>Status im Detail</h2><dl class="plain">${statusRows}</dl>${tipsHtml}</div>
    <div class="card"><h2>Zahlung &amp; Finanzierung</h2><dl class="plain">${paymentRows}${paymentStatus}</dl></div>
    <div class="card"><h2>Bestellverlauf</h2>${tlHtml}</div>
    <div class="card"><h2>Bestellschritte</h2>${steps(t)}</div>
    <div class="card" id="hist-${esc(referenceNumber)}"></div>
    ${entry.metaError ? `<p class="muted">Hinweis: Die Abfrage /order (FIN-Freigabe, Motornummer) war nicht möglich: ${esc(entry.metaError)}</p>` : ''}
    ${allDataSection(entry)}
    <details><summary>Komplette Tesla-Antwort als JSON anzeigen</summary><pre>${esc(JSON.stringify({ account: acc, meta, details }, null, 2))}</pre></details>`;
}

function renderHistory(hist) {
  for (const [rn, h] of Object.entries(hist)) {
    const box = document.getElementById('hist-' + rn);
    if (!box) continue;
    const changes = (h.changes || []).slice().reverse();
    if (!changes.length) {
      box.innerHTML = `<h2>Änderungen</h2><p class="empty">Keine Änderungen seit ${esc(fmtDate(h.firstAt) ?? '')}. Jeder Abruf in diesem Browser wird mit dem vorherigen verglichen, wie bei TOST.</p>`;
      continue;
    }
    const groups = [];
    for (const c of changes) { const g = groups[groups.length - 1]; if (g && g.at === c.at) g.items.push(c); else groups.push({ at: c.at, items: [c] }); }
    box.innerHTML = '<h2>Änderungen</h2>' + groups.slice(0, 30).map((g) => `
      <div class="chg"><div class="chg-when">${esc(fmtDate(g.at) ?? g.at)}</div>
        ${g.items.map((c) => `<div><b>${esc(pathLabel(c.path))}</b>: ${fmtChangeValue(c.path, c.before)} <span class="arrow">→</span> ${fmtChangeValue(c.path, c.after)}</div>`).join('')}
      </div>`).join('');
  }
}

async function show(data, cached) {
  await loadOptionCodes();
  if ((data.orders || []).some((o) => pick(o, 'details.tasks.registration.orderDetails.vehicleRoutingLocation') != null)) await loadLocations();
  const hist = store.get(HISTORY_KEY) || {};
  const vehiclesCard = Array.isArray(data.vehicles) && data.vehicles.length
    ? `<div class="card"><h2>Fahrzeuge im Konto <span class="muted">(${data.vehicles.length})</span></h2><p class="muted">Taucht das bestellte Auto hier auf, ist es bereits deinem Konto zugeordnet.</p>
       ${data.vehicles.map((v) => `<dl class="plain">${row('FIN', v.vin ? secret(v.vin) : null, '', true)}${row('Name', v.display_name)}${row('Status', v.state)}${row('Fahrzeug-ID', v.id_s ?? v.id, 'mono')}${row('In Service', yesNo(v.in_service))}</dl>`).join('<hr>')}</div>`
    : (data.vehiclesError ? `<p class="muted">Fahrzeugliste des Kontos nicht abrufbar: ${esc(data.vehiclesError)}</p>` : '');
  const notice = data.accountError
    ? `<div class="card error"><strong>Hinweis</strong><p>Die Konto-Übersicht (owner-api) konnte nicht geladen werden, daher fehlen Bestellstatus, Modellcode und Konfiguration: ${esc(data.accountError)}</p></div>`
    : '';
  out.innerHTML = notice + (data.orders?.length
    ? data.orders.map((o) => render(o, hist[o.referenceNumber])).join('')
    : '<div class="card"><p class="empty">Keine Bestellungen gefunden.</p></div>') + vehiclesCard;
  renderHistory(hist);
  const when = new Date(data.fetchedAt).toLocaleString(LOCALE);
  metaEl.textContent = cached ? `Zwischengespeicherte Daten von ${when}` : `Abgerufen ${when}`;
}

async function load(force = false) {
  btn.disabled = true;
  try {
    const cached = store.get(CACHE_KEY);
    if (!force && cached && Date.now() - cached.at < CACHE_MS) { await show(cached.data, true); return; }
    const res = await fetch('/api/orders');
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) {
      if (data.error === 'app_login_required') { location.href = '/login.html'; return; }
      if (data.error === 'tesla_login_required') {
        try { if (data.message) sessionStorage.setItem('tos.handoff', 'Tesla-Verbindung muss erneuert werden: ' + data.message); } catch {}
        location.href = '/tesla-login.html';
        return;
      }
    }
    if (!res.ok) throw new Error(data.message || data.error || `HTTP ${res.status}`);
    store.set(CACHE_KEY, { at: Date.now(), data });
    recordHistory(data);
    await show(data, false);
  } catch (err) {
    out.innerHTML = `<div class="card error"><strong>Fehler</strong><p>${esc(err.message)}</p><p><a href="/tesla-login.html">Tesla-Konto erneut verbinden</a></p></div>`;
    metaEl.textContent = '';
  } finally {
    btn.disabled = false;
  }
}

// ---------- Diagnose: Feldliste ohne persönliche Daten ----------
const PERSONAL_PATH = /(firstName|lastName|userName|fullName|\.name$|email|phone|mobile|address|street|city|zip|postal|iban|bic|birth|tax|license|plate|company|owner\.|registeredUser|customerName|contact)/i;
const SAFE_KEY = /(date|time|^eta|window|status|type|country|currency|model|code|complete|enabled|required|^order|version|language|locale|title|subtitle|messageBody|messageTitle|count|amount|balance|payment|financ|interest|term|mileage|odometer|routing|vinShows|motor|delivery|appointment|readiness|match|category|option|product|partner|intent|step|url|id$|^is[A-Z]|^has[A-Z]|^should[A-Z]|^can[A-Z]|header|description)/i;
const ENUM_LIKE = /^[A-Z0-9_ .:-]{1,40}$/;
function diagnose(data) {
  const lines = [`Abruf: ${data.fetchedAt}`, `Bestellungen: ${(data.orders || []).length}`, `Konto-Übersicht Fehler: ${data.accountError || 'keiner'}`,
    `Fahrzeuge im Konto: ${Array.isArray(data.vehicles) ? data.vehicles.length : 'n/a'} (Fehler: ${data.vehiclesError || 'keiner'})`];
  for (const o of data.orders || []) {
    lines.push('', `=== Bestellung ${mask(String(o.referenceNumber))} ===`, `/order Fehler: ${o.metaError || 'keiner'}`, `Fehler: ${o.error || 'keiner'}`,
      `reservation-details Fehler: ${o.extra?.reservationDetailsError || 'keiner'}`);
    const flat = flatten({ order: o.account ?? {}, meta: o.meta ?? {}, details: o.details ?? {}, reservation: o.extra?.reservationDetails ?? {} }, '', {});
    for (const [k, v] of Object.entries(flat).sort(([a], [b]) => a.localeCompare(b))) {
      if (v === null || v === '' || v === '[]' || v === '{}' || SKIP_IN_ALL.test(k)) continue;
      let shown;
      const key = k.split('.').pop();
      if (/vin$/i.test(k) && typeof v === 'string') shown = mask(v);
      else if (typeof v !== 'string') shown = String(v);
      else if (PERSONAL_PATH.test(k)) shown = `(persönlich, ${v.length} Zeichen)`;
      else if (SAFE_KEY.test(key) || ENUM_LIKE.test(v) || parseIso(v)) shown = v.length > 120 ? v.slice(0, 120) + '…' : v;
      else shown = `(Text, ${v.length} Zeichen)`;
      lines.push(`${k} = ${shown}`);
    }
  }
  return lines.join('\n');
}
document.getElementById('diag').addEventListener('click', async () => {
  const cached = store.get(CACHE_KEY);
  const box = document.getElementById('diagbox'), ta = document.getElementById('diagtext'), m = document.getElementById('diagmsg');
  if (!cached?.data) { m.textContent = 'Noch keine Daten geladen.'; box.hidden = false; return; }
  ta.value = diagnose(cached.data);
  box.hidden = false;
  try { await navigator.clipboard.writeText(ta.value); m.textContent = 'In die Zwischenablage kopiert. Einfach einfügen und abschicken.'; }
  catch { m.textContent = 'Text unten markieren und kopieren.'; ta.select(); }
});
document.getElementById('diagclose').addEventListener('click', () => { document.getElementById('diagbox').hidden = true; });

btn.addEventListener('click', () => load(true));
document.getElementById('tesla-logout').addEventListener('click', async () => {
  if (!confirm('Tesla-Token aus diesem Browser löschen? Danach ist ein erneuter Tesla-Login nötig.')) return;
  await fetch('/api/tesla/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  store.del(CACHE_KEY);
  location.href = '/tesla-login.html';
});
document.getElementById('logout').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  store.del(CACHE_KEY);
  location.href = '/login.html';
});
load();
</script>
